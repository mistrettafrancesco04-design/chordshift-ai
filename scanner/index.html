<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <meta name="theme-color" content="#0b0b0d">
  <title>Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading" class="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <p>Scanner wird vorbereitet…</p>
  </div>

  <!-- Kamera -->
  <section id="camera" class="screen active" aria-label="Kamera">
    <div class="viewfinder">
      <video id="video" autoplay muted playsinline></video>
      <svg id="overlay" class="overlay" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <polygon id="quad" data-testid="quad" class="quad" points=""></polygon>
      </svg>
      <div id="flash" class="flash"></div>
    </div>

    <div class="topbar">
      <button id="autoBtn" class="pill" aria-pressed="true" aria-label="Automatisch auslösen">
        <span class="dot"></span> Auto
      </button>
      <p id="hint" class="hint">Kamera wird gestartet…</p>
      <button id="torchBtn" class="icon-btn" aria-pressed="false" aria-label="Taschenlampe" hidden>
        <svg viewBox="0 0 24 24"><path d="M7 2h10v4l-3 4v12h-4V10L7 6z"/></svg>
      </button>
    </div>

    <div id="cameraError" class="camera-error" hidden>
      <p id="cameraErrorText"></p>
    </div>

    <div class="bottombar">
      <button id="galleryBtn" class="icon-btn large" aria-label="Aus Fotos importieren">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 3 3 3-3 5 5"/></svg>
      </button>
      <input id="galleryInput" type="file" accept="image/*" multiple hidden>

      <button id="shutterBtn" class="shutter" aria-label="Foto aufnehmen">
        <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
          <circle class="ring-bg" cx="40" cy="40" r="36"/>
          <circle id="ringProgress" class="ring-fg" cx="40" cy="40" r="36"/>
        </svg>
        <span class="shutter-core"></span>
      </button>

      <button id="doneBtn" class="thumb-btn" aria-label="Seiten anzeigen" disabled>
        <img id="lastThumb" alt="">
        <span id="busy" class="busy" hidden></span>
        <span class="badge" data-testid="page-count" id="pageCount">0</span>
      </button>
    </div>
  </section>

  <!-- Seite prüfen -->
  <section id="review" class="screen" aria-label="Seite prüfen">
    <header class="navbar">
      <button id="reviewBack" class="text-btn">Abbrechen</button>
      <h1 id="reviewTitle">Seite prüfen</h1>
      <button id="reviewDone" class="text-btn strong">Fertig</button>
    </header>
    <div id="editor" class="editor">
      <div id="editorStage" class="editor-stage">
        <canvas id="editorCanvas"></canvas>
        <svg id="editorSvg" class="editor-svg">
          <polygon id="editorQuad" class="quad"></polygon>
        </svg>
        <div id="loupe" class="loupe" hidden><canvas id="loupeCanvas" width="120" height="120"></canvas></div>
      </div>
    </div>
    <div id="filterBar" class="filters" role="radiogroup" aria-label="Filter">
      <button class="filter" role="radio" data-filter="auto" aria-checked="true"><img alt=""><span>Auto</span></button>
      <button class="filter" role="radio" data-filter="bw" aria-checked="false"><img alt=""><span>S/W</span></button>
      <button class="filter" role="radio" data-filter="gray" aria-checked="false"><img alt=""><span>Grau</span></button>
      <button class="filter" role="radio" data-filter="original" aria-checked="false"><img alt=""><span>Original</span></button>
    </div>
    <div class="toolbar">
      <button id="rotateBtn" class="tool"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>Drehen</button>
      <button id="resetCornersBtn" class="tool"><svg viewBox="0 0 24 24"><path d="M3 3h6M3 3v6M21 3h-6M21 3v6M3 21h6M3 21v-6M21 21h-6M21 21v-6"/></svg>Ganzes Bild</button>
      <button id="retakeBtn" class="tool"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l2-3h4l2 3"/></svg>Neu</button>
      <button id="deleteBtn" class="tool danger"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Löschen</button>
    </div>
  </section>

  <!-- Seiten & PDF -->
  <section id="pages" class="screen" aria-label="Seiten">
    <header class="navbar">
      <button id="pagesBack" class="text-btn">＋ Seite</button>
      <h1>Seiten</h1>
      <button id="clearBtn" class="text-btn danger">Alle löschen</button>
    </header>
    <ol id="pageList" class="page-list"></ol>
    <div class="export">
      <label class="filename">
        <span>Dateiname</span>
        <input id="fileName" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <button id="shareBtn" class="primary">PDF teilen</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button value="cancel" class="text-btn">Abbrechen</button>
        <button value="ok" id="confirmOk" class="text-btn strong">OK</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
